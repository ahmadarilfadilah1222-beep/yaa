<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Birthday Game 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap');

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Poppins,sans-serif;
    background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

.card{
    width:94%;
    max-width:420px;
    background:rgba(255,255,255,.08);
    border-radius:28px;
    padding:28px;
    backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(255,94,120,.35);
}

.slide{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1}}

h1{font-family:Pacifico;color:#ffb3d9;margin-bottom:6px}
p{font-size:14px;line-height:1.6}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#ff5e78,#ff85a2);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}
button:hover{transform:translateY(-2px)}

.choice{
    background:rgba(255,255,255,.12);
}

#typing{
    margin-top:16px;
    min-height:50px;
    color:#ffd6e8;
    font-style:italic;
}

.progress{
    margin-top:10px;
    height:6px;
    background:rgba(255,255,255,.15);
    border-radius:10px;
    overflow:hidden;
}
.progress span{
    display:block;
    height:100%;
    width:0%;
    background:#ff85a2;
    transition:.4s;
}
</style>
</head>

<body>

<div class="card">

<!-- OPEN -->
<div id="open" class="slide">
    <h1>Hai 💖</h1>
    <p>Ini bukan sekadar ucapan.<br>Ini permainan kecil buat kamu.</p>
    <input id="nama" placeholder="Nama" style="width:100%;padding:12px;border-radius:16px;border:none;margin-top:10px">
    <button id="start">Mulai 🎮</button>
</div>

<!-- GAME -->
<div id="game" class="slide" style="display:none">
    <h1 id="stageTitle"></h1>
    <p id="stageText"></p>

    <div id="choices"></div>

    <div id="typing"></div>

    <div class="progress"><span id="bar"></span></div>
</div>

<!-- END -->
<div id="end" class="slide" style="display:none">
    <h1>💖 Selesai</h1>
    <p id="endMsg"></p>
</div>

</div>

<script>
const open=document.getElementById("open");
const game=document.getElementById("game");
const end=document.getElementById("end");

const stageTitle=document.getElementById("stageTitle");
const stageText=document.getElementById("stageText");
const choices=document.getElementById("choices");
const typing=document.getElementById("typing");
const bar=document.getElementById("bar");

const nama=document.getElementById("nama");
document.getElementById("start").onclick=()=>{
    open.style.display="none";
    game.style.display="block";
    stage=0;
    nextStage();
};

let stage=0, typingInt;

function typeText(text){
    typing.textContent="";
    clearInterval(typingInt);
    let i=0;
    typingInt=setInterval(()=>{
        typing.textContent+=text[i++];
        if(i>=text.length)clearInterval(typingInt);
    },55);
}

function setProgress(p){bar.style.width=p+"%"}

function nextStage(){
    typing.textContent="";
    choices.innerHTML="";

    if(stage===0){
        setProgress(0);
        stageTitle.textContent="Stage 1";
        stageText.textContent="Pilih yang menurutmu paling aman.";
        addChoice("Langsung lanjut", false);
        addChoice("Baca pelan-pelan", true);
    }

    if(stage===1){
        setProgress(33);
        stageTitle.textContent="Stage 2";
        stageText.textContent="Kalau hari ini berat, apa yang paling kamu butuhkan?";
        addChoice("Didengarkan", true);
        addChoice("Dinasihati", false);
        addChoice("Ditinggal sendiri", false);
    }

    if(stage===2){
        setProgress(66);
        stageTitle.textContent="Stage 3";
        stageText.textContent="Klik tombol ini sampai kamu yakin.";
        addFinal();
    }

    if(stage===3){
        setProgress(100);
        game.style.display="none";
        end.style.display="block";
        document.getElementById("endMsg").textContent=
        "Terima kasih, "+nama.value+
        ". Kamu sudah melewati permainan kecil ini.\n\nSemoga hidupmu selalu menemukan alasan untuk tersenyum, bahkan di hari yang paling sunyi 🤍";
    }
}

function addChoice(text, correct){
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=text;
    b.onclick=()=>{
        if(correct){
            typeText("Pilihan yang hangat. Kita lanjut ✨");
            setTimeout(()=>{stage++;nextStage()},1600);
        }else{
            typeText("Tidak salah… tapi belum tepat 🙂");
        }
    };
    choices.appendChild(b);
}

function addFinal(){
    let click=0;
    const b=document.createElement("button");
    b.textContent="Aku yakin 💖";
    b.onclick=()=>{
        click++;
        if(click<3){
            typeText("Yakin? Coba klik sekali lagi…");
        }else{
            typeText("Iya. Kamu sampai di sini 🤍");
            setTimeout(()=>{stage++;nextStage()},2000);
        }
    };
    choices.appendChild(b);
}
</script>

</body>
</html>
